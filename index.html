<script type="module">
  import { createClient } from "https://esm.sh/@supabase/supabase-js@2.49.1";

  const SUPABASE_URL = "https://qnnnnvlissdqdwnkgrao.supabase.co";
  // Safe public browser key: paste your Supabase Publishable key (sb_publishable_...) or Legacy anon key
  const SUPABASE_PUBLIC_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE";

  const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLIC_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true,
    },
  });

  // 1. Silent zero-login auth: ensures every visitor has a real auth.users.id UUID
  async function ensureSession() {
    const { data: { session } } = await supabase.auth.getSession();
    if (session?.access_token) return session;

    const { data, error } = await supabase.auth.signInAnonymously();
    if (error || !data.session) {
      throw new Error(error?.message || "Anonymous sign-in failed. Enable Anonymous Sign-Ins in Supabase Auth.");
    }
    return data.session;
  }

  // 2. Fetch current credit balance (enforced by RLS: auth.uid() = user_id)
  async function getCreditsBalance() {
    const session = await ensureSession();
    const { data, error } = await supabase
      .from("user_credits")
      .select("credits_balance, lifetime_purchased, lifetime_used")
      .eq("user_id", session.user.id)
      .maybeSingle();

    if (error) throw error;
    return data?.credits_balance ?? 0;
  }

  // 3. Start Stripe Checkout via create-checkout Edge Function
  async function startCheckout(packageId = "starter") {
    const session = await ensureSession();

    const res = await fetch(`${SUPABASE_URL}/functions/v1/create-checkout`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLIC_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
      body: JSON.stringify({ packageId }),
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.url) {
      throw new Error(data.error || `Checkout failed (HTTP ${res.status})`);
    }

    window.location.assign(data.url);
  }

  // 4. Call Gemini curation Edge Function (SpotifyMore-curate)
  async function curateMood(payload) {
    const session = await ensureSession();

    const res = await fetch(`${SUPABASE_URL}/functions/v1/SpotifyMore-curate`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_PUBLIC_KEY,
        "Authorization": `Bearer ${session.access_token}`,
      },
      body: JSON.stringify(payload),
    });

    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      throw new Error(data.error || `Curation failed (HTTP ${res.status})`);
    }
    return data;
  }

  // 5. Handle return from Stripe Checkout (?checkout=success) with brief webhook poll
  async function handleCheckoutReturn(onCreditsUpdated) {
    const params = new URLSearchParams(window.location.search);
    const status = params.get("checkout");
    if (!status) return;

    // Clean query params without reloading
    const cleanUrl = `${window.location.pathname}${window.location.hash}`;
    window.history.replaceState({}, document.title, cleanUrl);

    if (status === "success") {
      // Poll briefly (up to ~10s) to give Stripe's webhook time to credit Postgres
      const initialBalance = await getCreditsBalance().catch(() => 0);
      for (let i = 0; i < 5; i++) {
        await new Promise((r) => setTimeout(r, 2000));
        const latest = await getCreditsBalance().catch(() => initialBalance);
        if (latest > initialBalance) {
          onCreditsUpdated?.(latest);
          return latest;
        }
      }
      onCreditsUpdated?.(await getCreditsBalance().catch(() => initialBalance));
    }
  }

  // 6. Relative Service Worker registration (safe under /FeelCue/ on GitHub Pages)
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker
        .register("./sw.js", { scope: "./" })
        .catch((err) => console.warn("SW registration failed:", err));
    });
  }

  // Expose cleanly for your existing UI buttons in index.html
  window.FeelCueBackend = {
    supabase,
    ensureSession,
    getCreditsBalance,
    startCheckout,
    curateMood,
    handleCheckoutReturn,
  };
</script>
